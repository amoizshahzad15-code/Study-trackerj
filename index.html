<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudySprint — Intelligent Syllabus Tracker & Study Planner</title>
  <meta name="description" content="Master any syllabus in 20, 30 or custom days. Track daily goals, auto-reschedule backlog, and study with Pomodoro." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            surface: {
              dark: '#090D16',
              darkcard: '#111726',
              darkborder: '#1E293B',
              light: '#F8FAFC',
              lightcard: '#FFFFFF',
              lightborder: '#E2E8F0',
            }
          },
          boxShadow: {
            'glow': '0 0 30px -5px rgba(16, 185, 129, 0.35)',
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #334155; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .bg-mesh-dark {
      background-color: #090D16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
    }
    .bg-mesh-light {
      background-color: #F8FAFC;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.06) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.03) 0px, transparent 50%);
    }

    /* Subtle micro-interactions */
    button {
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    button:active {
      transform: scale(0.96) !important;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.12);
      transition: all 0.2s ease;
    }
  </style>
</head>
<body class="font-sans antialiased selection:bg-brand-500 selection:text-white min-h-screen text-slate-800 dark:text-slate-100 bg-surface-light dark:bg-surface-dark transition-colors duration-150">

  <!-- ================= APP ROOT CONTAINER ================= -->
  <div id="app" class="min-h-screen flex flex-col md:flex-row">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- ================= NOT DONE ACTION POPUP (MODAL) ================= -->
  <div id="nd-popup" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onclick="closeNdPopup(event)">
    <div class="bg-white dark:bg-surface-darkcard border border-slate-200 dark:border-surface-darkborder rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
        <div>
          <h3 class="font-bold text-slate-900 dark:text-white text-sm">Reschedule Task</h3>
          <p id="nd-task-title" class="text-xs text-slate-400 truncate max-w-[240px] mt-0.5">Task title</p>
        </div>
        <button onclick="hideNdPopup()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="space-y-2">
        <button id="nd-btn-tomorrow" class="w-full flex items-center justify-between p-3 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-brand-500 hover:bg-brand-50/50 dark:hover:bg-brand-950/20 text-left transition-all">
          <div class="flex items-center gap-3">
            <span class="text-lg">➡️</span>
            <div>
              <div class="font-bold text-xs text-slate-800 dark:text-slate-200">Move to tomorrow</div>
              <div class="text-[11px] text-slate-400">Shift to the very next day</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </button>

        <button id="nd-btn-backlog" class="w-full flex items-center justify-between p-3 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-amber-500 hover:bg-amber-50/50 dark:hover:bg-amber-950/20 text-left transition-all">
          <div class="flex items-center gap-3">
            <span class="text-lg">📥</span>
            <div>
              <div class="font-bold text-xs text-slate-800 dark:text-slate-200">Send to backlog</div>
              <div class="text-[11px] text-slate-400">Recover later from Backlog Room</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </button>

        <button id="nd-btn-balance" class="w-full flex items-center justify-between p-3 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-emerald-500 hover:bg-emerald-50/50 dark:hover:bg-emerald-950/20 text-left transition-all">
          <div class="flex items-center gap-3">
            <span class="text-lg">⚖️</span>
            <div>
              <div class="font-bold text-xs text-slate-800 dark:text-slate-200">Balance over next 3 days</div>
              <div class="text-[11px] text-slate-400">Slots into least busy day</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= FLOATING MINI-DOCK (POMODORO) ================= -->
  <div id="mini-dock" class="hidden fixed bottom-6 right-6 z-40 bg-white/95 dark:bg-surface-darkcard/95 backdrop-blur-xl border border-slate-200 dark:border-surface-darkborder shadow-2xl rounded-2xl p-3 flex items-center gap-3 ring-1 ring-black/5 dark:ring-white/10">
    <div class="text-left">
      <div id="mini-dock-mode" class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Focus</div>
      <div id="mini-dock-time" class="font-mono text-base font-extrabold text-slate-900 dark:text-white">25:00</div>
    </div>
    <button onclick="pt()" id="mini-dock-btn" class="p-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white transition-colors" title="Play / Pause">
      <i id="mini-dock-icon" data-lucide="play" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- App Core Script -->
  <script src="./app.js"></script>
</body>
</html>
